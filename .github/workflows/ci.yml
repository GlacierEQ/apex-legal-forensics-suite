name: APEX-LEGAL-FORENSICS-SUITE Cloud CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-gate:
    name: 🐍 Backend Verification & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Syntax Compilation Check
        run: python -m compileall backend/app backend/tests
      - name: Run Test Suite
        run: python -m unittest discover -s backend/tests -v

  frontend-gate:
    name: ⚛️ Frontend Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Package Specification
        run: |
          cd frontend
          node -e "const pkg = require('./package.json'); console.log('✓ Valid package:', pkg.name, pkg.version)"
